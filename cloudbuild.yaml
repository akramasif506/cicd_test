options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'python:3.12-slim'
    entrypoint: bash
    args: ['-c', 'pip install -r requirements.txt && pytest test_app.py -v']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cicd-test-job', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cicd-test-job']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'cicd-test-job'
      - '--image=gcr.io/$PROJECT_ID/cicd-test-job'
      - '--region=us-central1'

images:
  - 'gcr.io/$PROJECT_ID/cicd-test-job'
